[project]
name = "forgejo-projects-mcp"
version = "0.1.0"
description = "MCP server for managing Forgejo Projects/Kanban boards"
readme = "README.md"
authors = [
    { name = "UnwantedForeignCloudProvider ", email = "donot@m3ss4ge.me" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.1.1",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[project.scripts]
forgejo-projects-mcp = "forgejo_projects_mcp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ty.src]
exclude = ["tests"]
