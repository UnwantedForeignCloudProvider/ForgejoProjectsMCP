[project]
name = "forgejo-projects-mcp"
dynamic = ["version"]
description = "MCP server for managing Forgejo Projects/Kanban boards"
readme = "README.md"
authors = [
    { name = "UnwantedForeignCloudProvider", email = "donot@m3ss4ge.me" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.1.1",
    "playwright>=1.62.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
    "mkdocs-material>=9.5.0",
    "mike>=2,<3",
]

[project.scripts]
forgejo-projects-mcp = "forgejo_projects_mcp:main"
forgejo-projects-cli = "forgejo_projects_mcp.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

# Version is derived from the latest git tag (vX.Y.Z) at build time.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
# On a clean commit without any tags (e.g. a fresh checkout), fall back
# rather than failing the build.
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/forgejo_projects_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: live tests against a real Forgejo instance (opt-in; require --forgejo-version or FORGEJO_TEST_URL, see tests/composes/)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ty.src]
exclude = ["tests"]
