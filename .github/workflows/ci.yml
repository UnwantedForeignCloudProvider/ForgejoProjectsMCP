name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Free on GitHub-hosted runners for public repositories.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # full history + tags for dynamic versioning

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # uv reads .python-version / requires-python and fetches Python if needed.
      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Run tests
        run: uv run pytest -q

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error
