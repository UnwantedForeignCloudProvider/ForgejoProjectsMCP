name: Publish to PyPI

# Prepared for LATER. This is dormant until you push a version tag like `v0.1.0`.
# Before the first real publish you must:
#   1. Create the project on PyPI (name: forgejo-projects-mcp), and
#   2. Configure a "Trusted Publisher" on PyPI for this repo pointing at:
#        workflow:    publish.yml
#        environment: pypi
#      (PyPI project -> Settings -> Publishing -> Add a new publisher.)
# With trusted publishing (OIDC) no API token/secret is needed.
#
# Prefer testing on TestPyPI first: uncomment the `repository-url` line in the
# publish step and configure a matching trusted publisher on test.pypi.org.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A GitHub Environment named "pypi" — create it in repo Settings and
    # (optionally) add required reviewers to gate real publishes.
    environment: pypi
    permissions:
      id-token: write        # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # For TestPyPI, uncomment:
          # repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
