name: Docs

# Publishes immutable documentation snapshots for release tags with mike, then
# deploys the complete version tree with GitHub's native Pages actions. The
# `gh-pages` branch is persistent storage for old versions, not the Pages source.

on:
  push:
    tags:
      - "v*"

# Allow one version deployment at a time; do not cancel a release deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Build tagged site (strict)
        run: uv run mkdocs build --strict

      - name: Deploy versioned documentation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ (a|b|rc)[0-9]*$ ]]; then
            echo "Deploying prerelease documentation: $VERSION"
            uv run mike deploy --push "$VERSION"
          else
            echo "Deploying stable documentation: $VERSION and updating latest"
            uv run mike deploy --push --update-aliases "$VERSION" latest
            uv run mike set-default --push latest
          fi

      - name: Prepare complete version tree
        run: git worktree add --detach "$RUNNER_TEMP/pages-site" gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
